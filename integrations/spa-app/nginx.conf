server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 308 /spa/;
    }

    location = /spa {
        return 308 /spa/;
    }

    location /spa/ {
        try_files $uri $uri/ /spa/index.html;
    }
}
