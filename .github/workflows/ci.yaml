name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GO_VERSION: "1.25.9"
  NODE_VERSION: "24"

jobs:
  # ------------------------------------------------------------
  # Backend: lint + test
  # ------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: authara_test
          POSTGRES_USER: authara
          POSTGRES_PASSWORD: authara
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U authara"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      POSTGRESQL_HOST: localhost
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: authara_test
      POSTGRESQL_USERNAME: authara
      POSTGRESQL_PASSWORD: authara
      POSTGRESQL_TIMEZONE: UTC
      POSTGRESQL_LOG_SQL: false
      AUTHARA_TEST_MAILPIT_HTTP_URL: http://localhost:8025
      AUTHARA_TEST_MAILPIT_SMTP_HOST: localhost
      AUTHARA_TEST_MAILPIT_SMTP_PORT: 1025

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check generated OpenAPI code
        run: make check-generated

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U authara -d authara_test; do
            echo "waiting for postgres..."
            sleep 2
          done

      - name: Apply database migrations
        run: |
          docker build \
            -f migrations/Dockerfile \
            -t authara-migrations:test \
            ./migrations

          docker run --rm \
            --network host \
            -e POSTGRESQL_HOST \
            -e POSTGRESQL_PORT \
            -e POSTGRESQL_DATABASE \
            -e POSTGRESQL_USERNAME \
            -e POSTGRESQL_PASSWORD \
            authara-migrations:test \
            up \
            -env=default \
            -config=./dbconfig.yaml

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.41.0

      - name: Check goimports formatting
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          files=$(git ls-files '*.go' ':!**/*_templ.go')
          test -z "$(goimports -l $files)"

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate templ files
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          templ generate

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Vet SSR app
        working-directory: integrations/ssr-app
        run: go vet ./...

      - name: Test SSR app
        working-directory: integrations/ssr-app
        run: go test ./...

      - name: Build SSR app
        working-directory: integrations/ssr-app
        run: go build ./cmd/ssr-app

  # ------------------------------------------------------------
  # Frontend: format + build
  # ------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            integrations/spa-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Test production static packaging
        run: sh scripts/test-static-packaging.sh

      - name: Install SPA app dependencies
        working-directory: integrations/spa-app
        run: npm ci

      - name: Test SPA app
        working-directory: integrations/spa-app
        run: npm test

      - name: Build SPA app
        working-directory: integrations/spa-app
        run: npm run build

  # ------------------------------------------------------------
  # Docker build-context policy + clean-checkout image builds
  # ------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Add forbidden-path sentinels
        run: |
          for context in . migrations integrations/ssr-app integrations/spa-app; do
            touch "$context/.env.cidocs2-sentinel"
            touch "$context/.DS_Store"
            touch "$context/coverage.cidocs2.out"
            touch "$context/cidocs2.tmp"
            mkdir -p \
              "$context/.cache" \
              "$context/.git" \
              "$context/.idea" \
              "$context/bin" \
              "$context/dist" \
              "$context/node_modules"
            touch "$context/.cache/cidocs2-sentinel"
            touch "$context/.git/cidocs2-sentinel"
            touch "$context/.idea/cidocs2-sentinel"
            touch "$context/bin/cidocs2-sentinel"
            touch "$context/dist/cidocs2-sentinel"
            touch "$context/node_modules/cidocs2-sentinel"
          done

      - name: Audit Docker build contexts
        run: |
          {
            echo "### Docker build-context sizes"
            echo
            echo "| Context | Measured | Limit |"
            echo "| --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          scripts/check-docker-context.sh . root 8192
          scripts/check-docker-context.sh ./migrations migrations 512
          scripts/check-docker-context.sh ./integrations/ssr-app ssr-app 512
          scripts/check-docker-context.sh ./integrations/spa-app spa-app 1024

      - name: Build app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.prod
          load: true
          push: false
          tags: authara:ci

      - name: Build remaining Docker images
        run: |
          docker build -f docker/Dockerfile.dev -t authara-dev:ci .
          docker build -f migrations/Dockerfile -t authara-migrations:ci ./migrations
          docker build -f integrations/ssr-app/Dockerfile -t authara-ssr-app:ci ./integrations/ssr-app
          docker build -f integrations/spa-app/Dockerfile -t authara-spa-app:ci ./integrations/spa-app

      - name: Inspect final production image
        run: scripts/check-docker-image.sh authara:ci
