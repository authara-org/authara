name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: core-cd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      core_bump: ${{ steps.core-release.outputs.bump }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Determine core release bump
        id: core-release
        run: |
          git fetch --tags --force origin
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          previous_version="${previous_tag#v}"
          current_version="${GITHUB_REF_NAME#v}"

          if test -z "$previous_tag"; then
            previous_version="0.0.0"
          fi

          IFS=. read -r previous_major previous_minor previous_patch <<< "$previous_version"
          IFS=. read -r current_major current_minor current_patch <<< "$current_version"

          if (( current_major > previous_major )); then
            bump="major"
          elif (( current_minor > previous_minor )); then
            bump="minor"
          else
            bump="patch"
          fi

          echo "Core ${GITHUB_REF_NAME}: ${bump} release since ${previous_tag:-no previous tag}"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Detect migration changes
        id: migrations
        run: |
          previous_tag="$(git tag --list 'migrations-v*' --sort=-version:refname | head -n 1)"
          if test -z "$previous_tag"; then
            echo "No previous migrations release found."
            exit 1
          fi

          current_version="${previous_tag#migrations-}"
          required_version="$(sed -nE 's/^const RequiredSchemaVersion = ([0-9]+)$/\1/p' internal/store/schema/version.go)"
          latest_file="$(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]-*.sql' | sort | tail -n 1)"
          latest_version="$(basename "$latest_file" | cut -d- -f1)"
          if (( 10#$latest_version != required_version )); then
            echo "Latest migration is $latest_version but Core requires schema version $required_version."
            exit 1
          fi

          migration_changes="$(git diff --name-only "$previous_tag" "$GITHUB_SHA" -- 'migrations/[0-9][0-9][0-9]-*.sql')"
          if test -z "$migration_changes"; then
            echo "No migration changes since $previous_tag."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          minor="$(cut -d. -f2 <<< "${current_version#v}")"
          next_version="v0.$((minor + 1)).0"

          echo "Migration changes since $previous_tag:"
          echo "$migration_changes"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=migrations-$next_version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrations image
        id: migrations-image
        if: steps.migrations.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./migrations
          file: migrations/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/authara-org/authara-migrations:${{ steps.migrations.outputs.version }}
            ghcr.io/authara-org/authara-migrations:latest

      - name: Create migrations release
        if: steps.migrations.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATIONS_TAG: ${{ steps.migrations.outputs.tag }}
          MIGRATIONS_VERSION: ${{ steps.migrations.outputs.version }}
          PREVIOUS_TAG: ${{ steps.migrations.outputs.previous_tag }}
        run: |
          notes="$RUNNER_TEMP/migrations-release-notes.md"
          printf 'Migrations for Authara Core `%s`:\n\n' "$GITHUB_REF_NAME" > "$notes"
          git diff --name-only "$PREVIOUS_TAG" "$GITHUB_SHA" -- 'migrations/[0-9][0-9][0-9]-*.sql' |
            while IFS= read -r migration; do
              printf -- '- `%s`\n' "$migration"
            done >> "$notes"
          printf '\nImage: `ghcr.io/authara-org/authara-migrations:%s`\n' "$MIGRATIONS_VERSION" >> "$notes"

          gh release create "$MIGRATIONS_TAG" \
            --target "$GITHUB_SHA" \
            --title "$MIGRATIONS_TAG" \
            --notes-file "$notes" \
            --latest=false

      - name: Build and push multi-arch image
        id: core-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/authara-org/authara-core:${{ github.ref_name }}
            ghcr.io/authara-org/authara-core:latest
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Record compatibility and publish Core release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATIONS_VERSION: ${{ steps.migrations.outputs.version }}
          MIGRATIONS_DIGEST: ${{ steps.migrations-image.outputs.digest }}
          CORE_DIGEST: ${{ steps.core-image.outputs.digest }}
        run: |
          if test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true"; then
            echo "Core release $GITHUB_REF_NAME must be a draft before CD attaches its metadata."
            exit 1
          fi

          if test -z "$MIGRATIONS_DIGEST"; then
            MIGRATIONS_DIGEST="$(
              docker buildx imagetools inspect \
                --format '{{json .Manifest}}' \
                "ghcr.io/authara-org/authara-migrations:$MIGRATIONS_VERSION" |
                jq -r .digest
            )"
          fi

          case "$CORE_DIGEST" in sha256:*) ;; *) echo "Invalid Core image digest: $CORE_DIGEST"; exit 1 ;; esac
          case "$MIGRATIONS_DIGEST" in sha256:*) ;; *) echo "Invalid migrations image digest: $MIGRATIONS_DIGEST"; exit 1 ;; esac

          core_tag="ghcr.io/authara-org/authara-core:$GITHUB_REF_NAME"
          core_image="ghcr.io/authara-org/authara-core@$CORE_DIGEST"
          migrations_tag="ghcr.io/authara-org/authara-migrations:$MIGRATIONS_VERSION"
          migrations_image="ghcr.io/authara-org/authara-migrations@$MIGRATIONS_DIGEST"

          metadata="$RUNNER_TEMP/authara-images.env"
          printf 'AUTHARA_CORE_VERSION=%s\n' "$GITHUB_REF_NAME" > "$metadata"
          printf 'AUTHARA_CORE_IMAGE=%s\n' "$core_image" >> "$metadata"
          printf 'AUTHARA_MIGRATIONS_VERSION=%s\n' "$MIGRATIONS_VERSION" >> "$metadata"
          printf 'AUTHARA_MIGRATIONS_IMAGE=%s\n' "$migrations_image" >> "$metadata"
          gh release upload "$GITHUB_REF_NAME" "$metadata" --clobber

          existing_notes="$RUNNER_TEMP/core-release-existing-notes.md"
          notes="$RUNNER_TEMP/core-release-notes.md"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$existing_notes"
          sed '/^<!-- authara-compatible-images -->$/,$d' "$existing_notes" > "$notes"
          printf '\n<!-- authara-compatible-images -->\n' >> "$notes"
          printf '## Compatible container images\n\n' >> "$notes"
          printf -- '- Core: `%s` (`%s`)\n' "$core_tag" "$core_image" >> "$notes"
          printf -- '- Migrations: `%s` (`%s`)\n' "$migrations_tag" "$migrations_image" >> "$notes"

          gh release edit "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --draft=false \
            --latest

  notify-sdks:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Dispatch immutable release to SDK repositories
        env:
          GH_TOKEN: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN }}
          CORE_TAG: ${{ github.ref_name }}
          CORE_SHA: ${{ github.sha }}
          CORE_BUMP: ${{ needs.deploy.outputs.core_bump }}
        run: |
          for repository in authara-go authara-browser; do
            gh api --method POST "repos/authara-org/${repository}/dispatches" \
              -f event_type=authara-core-released \
              -f "client_payload[core_tag]=${CORE_TAG}" \
              -f "client_payload[core_sha]=${CORE_SHA}" \
              -f "client_payload[core_bump]=${CORE_BUMP}"
          done
