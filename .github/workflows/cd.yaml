name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/authara-org/authara-core:${{ github.ref_name }}
            ghcr.io/authara-org/authara-core:latest
          build-args: |
            VERSION=${{ github.ref_name }}

  publish-go-sdk:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout core
        uses: actions/checkout@v6

      - name: Checkout Go SDK
        uses: actions/checkout@v6
        with:
          repository: authara-org/authara-go
          path: .sdk/authara-go
          token: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"

      - name: Generate SDK from released contract
        working-directory: .sdk/authara-go
        env:
          # Keep generation reproducible; bump this when cmd/authara-sdk-gen changes.
          AUTHARA_GO_GENERATOR_REF: 0a88aae
        run: >-
          go run
          github.com/authara-org/authara-go/cmd/authara-sdk-gen@${AUTHARA_GO_GENERATOR_REF}
          -openapi ../../contract/openapi.yaml
          -out authara

      - name: Test generated SDK
        working-directory: .sdk/authara-go
        run: go test ./...

      - name: Detect SDK changes
        id: sdk-changes
        working-directory: .sdk/authara-go
        run: |
          if test -n "$(git status --porcelain -- authara/openapi_types.gen.go authara/openapi_client.gen.go)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SDK changes for authara-core ${{ github.ref_name }}; skipping authara-go tag."
          fi

      - name: Commit and tag SDK release
        if: steps.sdk-changes.outputs.changed == 'true'
        working-directory: .sdk/authara-go
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${{ github.ref_name }}"; then
            echo "authara-go tag ${{ github.ref_name }} already exists but generated SDK files changed." >&2
            exit 1
          fi
          git add authara/openapi_types.gen.go authara/openapi_client.gen.go
          git commit -m "Update generated SDK for authara-core ${{ github.ref_name }}"
          git push origin HEAD:main
          git tag -a "${{ github.ref_name }}" -m "authara-go ${{ github.ref_name }} for authara-core ${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"

      - name: Create SDK GitHub release
        if: steps.sdk-changes.outputs.changed == 'true'
        working-directory: .sdk/authara-go
        env:
          GH_TOKEN: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo authara-org/authara-go \
            --verify-tag \
            --title "authara-go ${{ github.ref_name }}" \
            --generate-notes \
            --notes "Generated from authara-core ${{ github.ref_name }}."
