name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      core_bump: ${{ steps.core-release.outputs.bump }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Determine core release bump
        id: core-release
        run: |
          git fetch --tags --force origin
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          previous_version="${previous_tag#v}"
          current_version="${GITHUB_REF_NAME#v}"

          if test -z "$previous_tag"; then
            previous_version="0.0.0"
          fi

          IFS=. read -r previous_major previous_minor previous_patch <<< "$previous_version"
          IFS=. read -r current_major current_minor current_patch <<< "$current_version"

          if (( current_major > previous_major )); then
            bump="major"
          elif (( current_minor > previous_minor )); then
            bump="minor"
          else
            bump="patch"
          fi

          echo "Core ${GITHUB_REF_NAME}: ${bump} release since ${previous_tag:-no previous tag}"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/authara-org/authara-core:${{ github.ref_name }}
            ghcr.io/authara-org/authara-core:latest
          build-args: |
            VERSION=${{ github.ref_name }}

  notify-sdks:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Dispatch immutable release to SDK repositories
        env:
          GH_TOKEN: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN }}
          CORE_TAG: ${{ github.ref_name }}
          CORE_SHA: ${{ github.sha }}
          CORE_BUMP: ${{ needs.deploy.outputs.core_bump }}
        run: |
          for repository in authara-go authara-browser; do
            gh api --method POST "repos/authara-org/${repository}/dispatches" \
              -f event_type=authara-core-released \
              -f "client_payload[core_tag]=${CORE_TAG}" \
              -f "client_payload[core_sha]=${CORE_SHA}" \
              -f "client_payload[core_bump]=${CORE_BUMP}"
          done
