name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable release PR auto-merge
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--branches--main"))][0].number')"
          if test -z "$pr_number"; then
            echo "No open Release Please PR found."
            exit 0
          fi
          gh pr update-branch --repo "$GITHUB_REPOSITORY" "$pr_number"
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$pr_number"
