version: 1

# Runtime-policy classification is deliberately separate from environment
# parsing metadata. A variable is not operator-editable unless its control is
# hybrid and its reload mode is dynamic here and it is registered by Core.
settings_metadata:
  APP_ENV: {control: env, reload: startup, sensitive: false, group: runtime}
  LOG_LEVEL: {control: env, reload: startup, sensitive: false, group: runtime}
  AUTHARA_METRICS_ENABLED: {control: env, reload: startup, sensitive: false, group: runtime}
  POSTGRESQL_HOST: {control: env, reload: startup, sensitive: false, group: database}
  POSTGRESQL_PORT: {control: env, reload: startup, sensitive: false, group: database}
  POSTGRESQL_DATABASE: {control: env, reload: startup, sensitive: false, group: database}
  POSTGRESQL_USERNAME: {control: env, reload: startup, sensitive: true, group: database}
  POSTGRESQL_PASSWORD: {control: env, reload: startup, sensitive: true, group: database}
  POSTGRESQL_SCHEMA: {control: env, reload: startup, sensitive: false, group: database}
  POSTGRESQL_TIMEZONE: {control: env, reload: startup, sensitive: false, group: database}
  POSTGRESQL_LOG_SQL: {control: env, reload: startup, sensitive: false, group: database}
  AUTHARA_DB_MAX_OPEN_CONNS: {control: env, reload: startup, sensitive: false, group: database}
  AUTHARA_DB_MAX_IDLE_CONNS: {control: env, reload: startup, sensitive: false, group: database}
  AUTHARA_DB_CONN_MAX_LIFETIME: {control: env, reload: startup, sensitive: false, group: database}
  AUTHARA_DB_CONN_MAX_IDLE_TIME: {control: env, reload: startup, sensitive: false, group: database}
  AUTHARA_CACHE_PROVIDER: {control: env, reload: startup, sensitive: false, group: cache}
  AUTHARA_REDIS_HOST: {control: env, reload: startup, sensitive: false, group: cache}
  AUTHARA_REDIS_PORT: {control: env, reload: startup, sensitive: false, group: cache}
  AUTHARA_REDIS_PASSWORD: {control: env, reload: startup, sensitive: true, group: cache}
  AUTHARA_REDIS_DB: {control: env, reload: startup, sensitive: false, group: cache}
  PUBLIC_URL: {control: env, reload: startup, sensitive: false, group: public_url}
  AUTHARA_DEFAULT_RETURN_TO: {control: env, reload: startup, sensitive: false, group: public_url}
  AUTHARA_TRUST_PROXY_HEADERS: {control: env, reload: startup, sensitive: false, group: public_url}
  AUTHARA_USERNAME_LOGIN_ENABLED: {control: env, reload: startup, sensitive: false, group: authentication}
  AUTHARA_JWT_ISSUER: {control: env, reload: startup, sensitive: false, group: tokens}
  AUTHARA_JWT_ACTIVE_KEY_ID: {control: env, reload: startup, sensitive: false, group: tokens}
  AUTHARA_JWT_KEYS: {control: env, reload: startup, sensitive: true, group: tokens}
  AUTHARA_ACCESS_TOKEN_TTL_MINUTES: {control: env, reload: startup, sensitive: false, group: tokens}
  AUTHARA_SESSION_TTL_DAYS: {control: env, reload: startup, sensitive: false, group: sessions}
  AUTHARA_REFRESH_TOKEN_TTL_DAYS: {control: env, reload: startup, sensitive: false, group: sessions}
  AUTHARA_REFRESH_TOKEN_ROTATION_INTERVAL: {control: env, reload: startup, sensitive: false, group: sessions}
  AUTHARA_ORG_MODE: {control: env, reload: startup, sensitive: false, group: organizations}
  AUTHARA_PUBLIC_ORGANIZATION_MANAGEMENT_ENABLED: {control: env, reload: startup, sensitive: false, group: organizations}
  AUTHARA_ORGANIZATION_INVITATION_TTL: {control: env, reload: startup, sensitive: false, group: organizations}
  AUTHARA_INTERNAL_API_TOKEN: {control: env, reload: startup, sensitive: true, group: internal_api}
  AUTHARA_OAUTH_PROVIDERS: {control: env, reload: startup, sensitive: false, group: oauth}
  AUTHARA_OAUTH_GOOGLE_CLIENT_ID: {control: env, reload: startup, sensitive: false, group: oauth}
  AUTHARA_RATE_LIMIT_LOGIN_IP_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_LOGIN_IP_WINDOW: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_LOGIN_EMAIL_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_LOGIN_EMAIL_WINDOW: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_SIGNUP_IP_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_SIGNUP_IP_WINDOW: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_SIGNUP_EMAIL_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_SIGNUP_EMAIL_WINDOW: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_PASSWORD_RESET_IP_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
