  AUTHARA_WEBHOOK_MAINTENANCE_BATCH_SIZE: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_ACCESS_POLICY_ALLOWLIST_ENABLED: {control: env, reload: startup, sensitive: false, group: access_policy}
  AUTHARA_ADMIN_AUDIT_RETENTION_DAYS: {control: env, reload: startup, sensitive: false, group: retention}
  AUTHARA_CHALLENGE_ENABLED: {control: env, reload: startup, sensitive: false, group: challenges}
  AUTHARA_CHALLENGE_TTL: {control: hybrid, reload: dynamic, sensitive: false, group: challenges}
  AUTHARA_CHALLENGE_VERIFICATION_CODE_TTL: {control: hybrid, reload: dynamic, sensitive: false, group: challenges}
  AUTHARA_CHALLENGE_MAX_ATTEMPTS: {control: hybrid, reload: dynamic, sensitive: false, group: challenges}
  AUTHARA_CHALLENGE_MAX_RESENDS: {control: hybrid, reload: dynamic, sensitive: false, group: challenges}
  AUTHARA_CHALLENGE_MIN_RESEND_INTERVAL: {control: hybrid, reload: dynamic, sensitive: false, group: challenges}
  AUTHARA_EMAIL_PROVIDER: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_FROM: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_SMTP_HOST: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_SMTP_PORT: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_SMTP_USERNAME: {control: env, reload: startup, sensitive: true, group: email}
  AUTHARA_EMAIL_SMTP_PASSWORD: {control: env, reload: startup, sensitive: true, group: email}
  AUTHARA_EMAIL_SMTP_TLS: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_SMTP_TIMEOUT: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_WORKER_COUNT: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_WORKER_POLL_INTERVAL: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_JOB_MAX_ATTEMPTS: {control: env, reload: startup, sensitive: false, group: email}
  AUTHARA_EMAIL_CLEANUP_SENT_AFTER: {control: env, reload: startup, sensitive: false, group: retention}
  AUTHARA_EMAIL_CLEANUP_FAILED_AFTER: {control: env, reload: startup, sensitive: false, group: retention}

# Operator-only settings live in purpose-built database tables rather than as
# environment variables: email template contents and per-template delivery.

variables:

  # ------------------------------------------------------------
  # App / Runtime
  # ------------------------------------------------------------

  - name: APP_ENV
    stability: stable
    required: false
    type: enum
    default: dev
    allowed_values: [dev, prod]

  - name: LOG_LEVEL
    stability: stable
    required: false
    type: string
    default:
      dev: debug
      prod: info

  - name: AUTHARA_METRICS_ENABLED
    stability: stable
    required: false
    type: bool
    default: false
    description: Enables Prometheus metric collection and the GET /metrics endpoint.

  # ------------------------------------------------------------
  # Database
  # ------------------------------------------------------------

  - name: POSTGRESQL_HOST
    stability: stable
    required: true
    type: string

  - name: POSTGRESQL_PORT
    stability: stable
    required: true
    type: int

  - name: POSTGRESQL_DATABASE
    stability: stable
    required: true
    type: string

  - name: POSTGRESQL_USERNAME
    stability: stable
    required: true
    type: string

  - name: POSTGRESQL_PASSWORD
    stability: stable
    required: true
    type: string

  - name: POSTGRESQL_SCHEMA
    stability: stable
    required: false
    type: string
    default: authara

  - name: POSTGRESQL_TIMEZONE
    stability: stable
    required: false
    type: string
    default: UTC

  - name: POSTGRESQL_LOG_SQL
    stability: stable
    required: false
    type: bool
    default: false

  - name: AUTHARA_DB_MAX_OPEN_CONNS
    stability: stable
    required: false
    type: int
    default: 40

  - name: AUTHARA_DB_MAX_IDLE_CONNS
    stability: stable
    required: false
    type: int
    default: 20

  - name: AUTHARA_DB_CONN_MAX_LIFETIME
    stability: stable
    required: false
    type: duration
    default: 30m

  - name: AUTHARA_DB_CONN_MAX_IDLE_TIME
    stability: stable
    required: false
    type: duration
    default: 5m

  # ------------------------------------------------------------
  # Cache
  # ------------------------------------------------------------

  - name: AUTHARA_CACHE_PROVIDER
    stability: stable
    required: false
    type: enum
    default: noop
    description: Redis enables shared rate limits and immediate access-token revocation checks. Noop keeps access tokens valid until expiry after a session, user, or membership is revoked.
    allowed_values:
      - noop
      - redis

  - name: AUTHARA_REDIS_HOST
    stability: stable
    required: false
    type: string
    default: localhost
    notes: Used when AUTHARA_CACHE_PROVIDER=redis

  - name: AUTHARA_REDIS_PORT
    stability: stable
    required: false
    type: int
    default: 6379
    notes: Used when AUTHARA_CACHE_PROVIDER=redis

  - name: AUTHARA_REDIS_PASSWORD
    stability: stable
    required: false
    type: string
    notes: Used when AUTHARA_CACHE_PROVIDER=redis

  - name: AUTHARA_REDIS_DB
    stability: stable
    required: false
    type: int
    default: 0
    notes: Used when AUTHARA_CACHE_PROVIDER=redis

  # ------------------------------------------------------------
  # Public URL
  # ------------------------------------------------------------

  - name: PUBLIC_URL
    stability: stable
    required: true
    type: url
    notes: Must not include /auth

  - name: AUTHARA_DEFAULT_RETURN_TO
    stability: stable
    required: false
    type: string
    default: /
    notes: Safe relative path used after auth flows when return_to is not provided.

  - name: AUTHARA_TRUST_PROXY_HEADERS
    stability: stable
    required: false
    type: bool
    default: false
    notes: Enables trusted X-Forwarded-For/X-Real-IP parsing when Authara is behind a proxy that strips client-supplied forwarded headers.

  # ------------------------------------------------------------
  # Authentication
  # ------------------------------------------------------------

  - name: AUTHARA_USERNAME_LOGIN_ENABLED
    stability: stable
    required: false
    type: bool
    default: false
    description: Allows password login with a username in addition to an email address.

  # ------------------------------------------------------------
  # JWT / Tokens
  # ------------------------------------------------------------

  - name: AUTHARA_JWT_ISSUER
    stability: stable
    required: true
    type: string

  - name: AUTHARA_JWT_ACTIVE_KEY_ID
    stability: stable
    required: true
    type: string

  - name: AUTHARA_JWT_KEYS
    stability: stable
    required: true
    type: map[string]base64
    format: "keyID:base64secret,keyID2:base64secret2"

  - name: AUTHARA_ACCESS_TOKEN_TTL_MINUTES
    stability: stable
    required: false
    type: int
    default: 10

  - name: AUTHARA_SESSION_TTL_DAYS
    stability: stable
    required: false
    type: int
    default: 60

  - name: AUTHARA_REFRESH_TOKEN_TTL_DAYS
    stability: stable
    required: false
    type: int
    default: 14

  - name: AUTHARA_REFRESH_TOKEN_ROTATION_INTERVAL
    stability: stable
    required: false
    type: string
    default: 24h
    allowed_values:
      - disabled
      - off
      - always
      - duration

  - name: AUTHARA_ORG_MODE
    stability: stable
    required: false
    type: enum
    default: single
    description: Boot-time organization behavior profile. Choose before first production use; changing after users or organizations exist is unsupported.
    allowed_values:
      - personal
      - single
      - multi

  - name: AUTHARA_PUBLIC_ORGANIZATION_MANAGEMENT_ENABLED
    stability: stable
    required: false
    type: bool
    default: false
    description: Allows authenticated clients to manage non-capacity organization data directly through Authara. Organization creation, invitation creation, and invitation resend remain internal-only for backend billing and seat-limit checks.

  - name: AUTHARA_ORGANIZATION_INVITATION_TTL
    stability: stable
    required: false
    type: duration
    default: 168h

  - name: AUTHARA_INTERNAL_API_TOKEN
    stability: stable
    required: false
    type: string
    notes: Required for calls to /auth/internal/v1 routes. If empty, internal routes reject requests.

  # ------------------------------------------------------------
  # OAuth
  # ------------------------------------------------------------

  - name: AUTHARA_OAUTH_PROVIDERS
    stability: stable
    required: false
    type: csv
    allowed_values:
      - google

  - name: AUTHARA_OAUTH_GOOGLE_CLIENT_ID
    stability: stable
    required: false
    type: string
    required_if:
      variable: AUTHARA_OAUTH_PROVIDERS
      contains: google

  # ------------------------------------------------------------
  # Rate Limiting (Login)
  # ------------------------------------------------------------

  - name: AUTHARA_RATE_LIMIT_LOGIN_IP_LIMIT
    stability: stable
    required: false
    type: int
    default: 5

  - name: AUTHARA_RATE_LIMIT_LOGIN_IP_WINDOW
    stability: stable
    required: false
    type: duration
    default: 1m

  - name: AUTHARA_RATE_LIMIT_LOGIN_EMAIL_LIMIT
    stability: stable
    required: false
    type: int
    default: 10

  - name: AUTHARA_RATE_LIMIT_LOGIN_EMAIL_WINDOW
    stability: stable
    required: false
    type: duration
    default: 1h

  # ------------------------------------------------------------
  # Rate Limiting (Signup)
  # ------------------------------------------------------------

  - name: AUTHARA_RATE_LIMIT_SIGNUP_IP_LIMIT
    stability: stable
    required: false
    type: int
    default: 3

  - name: AUTHARA_RATE_LIMIT_SIGNUP_IP_WINDOW
    stability: stable
    required: false
    type: duration
    default: 1h

  - name: AUTHARA_RATE_LIMIT_SIGNUP_EMAIL_LIMIT
    stability: stable
    required: false
    type: int
    default: 3

  - name: AUTHARA_RATE_LIMIT_SIGNUP_EMAIL_WINDOW
    stability: stable
    required: false
    type: duration
    default: 24h

  # ------------------------------------------------------------
  # Rate Limiting (Password Reset)
  # ------------------------------------------------------------

  - name: AUTHARA_RATE_LIMIT_PASSWORD_RESET_IP_LIMIT
    stability: stable
    required: false
    type: int
    default: 5

  - name: AUTHARA_RATE_LIMIT_PASSWORD_RESET_IP_WINDOW
    stability: stable
    required: false
    type: duration
    default: 1h

  - name: AUTHARA_RATE_LIMIT_PASSWORD_RESET_EMAIL_LIMIT
    stability: stable
    required: false
    type: int
    default: 3

  - name: AUTHARA_RATE_LIMIT_PASSWORD_RESET_EMAIL_WINDOW
    stability: stable
    required: false
    type: duration
    default: 24h

  # ------------------------------------------------------------
  # Rate Limiting (Passkey Login)
  # ------------------------------------------------------------

  - name: AUTHARA_RATE_LIMIT_PASSKEY_LOGIN_IP_LIMIT
    stability: stable
    required: false
    type: int
    default: 30

  - name: AUTHARA_RATE_LIMIT_PASSKEY_LOGIN_IP_WINDOW
    stability: stable
    required: false
    type: duration
    default: 10m

  # ------------------------------------------------------------
  # Rate Limiting (Challenge Verify)
  # ------------------------------------------------------------

  - name: AUTHARA_RATE_LIMIT_CHALLENGE_VERIFY_IP_LIMIT
    stability: stable
    required: false
    type: int
    default: 30

  - name: AUTHARA_RATE_LIMIT_CHALLENGE_VERIFY_IP_WINDOW
    stability: stable
    required: false
    type: duration
    default: 10m

  # ------------------------------------------------------------
  # Rate Limiting (Challenge Resend)
  # ------------------------------------------------------------

  - name: AUTHARA_RATE_LIMIT_CHALLENGE_RESEND_IP_LIMIT
    stability: stable
    required: false
    type: int
    default: 10

  - name: AUTHARA_RATE_LIMIT_CHALLENGE_RESEND_IP_WINDOW
    stability: stable
    required: false
    type: duration
    default: 1h

  # ------------------------------------------------------------
  # Limiter Safety
  # ------------------------------------------------------------

  - name: AUTHARA_RATE_LIMIT_CLEANUP_EVERY
    stability: stable
    required: false
    type: int
    default: 200

  - name: AUTHARA_RATE_LIMIT_MAX_ENTRIES
    stability: stable
    required: false
    type: int
    default: 50000

  # ------------------------------------------------------------
  # Webhook Events
  # ------------------------------------------------------------

  - name: AUTHARA_WEBHOOK_URL
    stability: stable
    required: false
    type: url

  - name: AUTHARA_WEBHOOK_SECRET
    stability: stable
    required: false
    type: string

  - name: AUTHARA_WEBHOOK_ENABLED_EVENTS
    stability: stable
    required: false
    type: csv
    allowed_values:
      - user.created
      - user.updated
      - user.deleted
      - organization.created
      - organization.updated
      - organization.deleted
      - organization.membership.created
      - organization.membership.updated
      - organization.membership.deleted
      - organization.invitation.created
      - organization.invitation.accepted
      - organization.invitation.revoked

  - name: AUTHARA_WEBHOOK_TIMEOUT
    stability: stable
    required: false
    type: duration
    default: 5s

  - name: AUTHARA_WEBHOOK_WORKER_COUNT
    stability: stable
    required: false
    type: int
    default: 2

  - name: AUTHARA_WEBHOOK_MAX_DELIVERY_ATTEMPTS
    stability: stable
    required: false
    type: int
    default: 3

  - name: AUTHARA_WEBHOOK_PROCESSING_STALE_AFTER
    stability: stable
    required: false
    type: duration
    default: 2m

  - name: AUTHARA_WEBHOOK_STALE_REAPER_INTERVAL
    stability: stable
    required: false
    type: duration
    default: 1m

  - name: AUTHARA_WEBHOOK_DELIVERED_RETENTION
    stability: stable
    required: false
    type: duration
    default: 24h

  - name: AUTHARA_WEBHOOK_FAILED_RETENTION
    stability: stable
    required: false
    type: duration
    default: 720h

  - name: AUTHARA_WEBHOOK_CLEANUP_INTERVAL
    stability: stable
    required: false
    type: duration
    default: 1h

  - name: AUTHARA_WEBHOOK_MAINTENANCE_BATCH_SIZE
    stability: stable
    required: false
    type: int
    default: 1000

  # ------------------------------------------------------------
  # Access Policy
  # ------------------------------------------------------------

  - name: AUTHARA_ACCESS_POLICY_ALLOWLIST_ENABLED 
    stability: stable
    required: false
    type: bool
    default: false

  # ------------------------------------------------------------
  # Admin
  # ------------------------------------------------------------

  - name: AUTHARA_ADMIN_AUDIT_RETENTION_DAYS
    stability: stable
    required: false
    type: int
    default: 180
    notes: Delete admin audit events after this many days. Must be greater than 0.

  # ------------------------------------------------------------
  # Challenge / Verification
  # ------------------------------------------------------------

  - name: AUTHARA_CHALLENGE_ENABLED
    stability: stable
    required: false
    type: bool
    default: false

  - name: AUTHARA_CHALLENGE_TTL
    stability: stable
    required: false
    type: duration
    default: 30m

  - name: AUTHARA_CHALLENGE_VERIFICATION_CODE_TTL
    stability: stable
    required: false
    type: duration
    default: 10m
    notes: Must be less than or equal to AUTHARA_CHALLENGE_TTL

  - name: AUTHARA_CHALLENGE_MAX_ATTEMPTS
    stability: stable
    required: false
    type: int
    default: 5

  - name: AUTHARA_CHALLENGE_MAX_RESENDS
    stability: stable
    required: false
    type: int
    default: 3

  - name: AUTHARA_CHALLENGE_MIN_RESEND_INTERVAL
    stability: stable
    required: false
    type: duration
    default: 30s

  # ------------------------------------------------------------
  # Email
  # ------------------------------------------------------------

  - name: AUTHARA_EMAIL_PROVIDER
    stability: stable
    required: false
    type: enum
    default: noop
    allowed_values:
      - noop
      - smtp

  - name: AUTHARA_EMAIL_FROM
    stability: stable
    required: false
    type: string
    notes: Required when AUTHARA_EMAIL_PROVIDER=smtp

  - name: AUTHARA_EMAIL_SMTP_HOST
    stability: stable
    required: false
    type: string
    notes: Required when AUTHARA_EMAIL_PROVIDER=smtp

  - name: AUTHARA_EMAIL_SMTP_PORT
    stability: stable
    required: false
    type: int
    default: 587

  - name: AUTHARA_EMAIL_SMTP_USERNAME
    stability: stable
    required: false
    type: string

  - name: AUTHARA_EMAIL_SMTP_PASSWORD
    stability: stable
    required: false
    type: string

  - name: AUTHARA_EMAIL_SMTP_TLS
    stability: stable
    required: false
    type: bool
    default: true

  - name: AUTHARA_EMAIL_SMTP_TIMEOUT
    stability: stable
    required: false
    type: duration
    default: 10s

  # ------------------------------------------------------------
  # Email Worker
  # ------------------------------------------------------------

  - name: AUTHARA_EMAIL_WORKER_COUNT
    stability: stable
    required: false
    type: int
    default: 2

  - name: AUTHARA_EMAIL_WORKER_POLL_INTERVAL
    stability: stable
    required: false
    type: duration
    default: 2s

  - name: AUTHARA_EMAIL_JOB_MAX_ATTEMPTS
    stability: stable
    required: false
    type: int
    default: 10

  # ------------------------------------------------------------
  # Email Cleanup
  # ------------------------------------------------------------

  - name: AUTHARA_EMAIL_CLEANUP_SENT_AFTER
    stability: stable
    required: false
    type: duration
    default: 720h
    notes: Delete sent emails after duration (30 days)

  - name: AUTHARA_EMAIL_CLEANUP_FAILED_AFTER
    stability: stable
    required: false
    type: duration
    default: 2160h
    notes: Delete failed emails after duration (90 days)
