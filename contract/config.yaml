  AUTHARA_RATE_LIMIT_PASSKEY_LOGIN_IP_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_PASSKEY_LOGIN_IP_WINDOW: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_CHALLENGE_VERIFY_IP_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_CHALLENGE_VERIFY_IP_WINDOW: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_CHALLENGE_RESEND_IP_LIMIT: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_CHALLENGE_RESEND_IP_WINDOW: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_CLEANUP_EVERY: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_RATE_LIMIT_MAX_ENTRIES: {control: hybrid, reload: dynamic, sensitive: false, group: rate_limits}
  AUTHARA_WEBHOOK_URL: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_SECRET: {control: env, reload: startup, sensitive: true, group: webhooks}
  AUTHARA_WEBHOOK_ENABLED_EVENTS: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_TIMEOUT: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_WORKER_COUNT: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_MAX_DELIVERY_ATTEMPTS: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_PROCESSING_STALE_AFTER: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_STALE_REAPER_INTERVAL: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_DELIVERED_RETENTION: {control: env, reload: startup, sensitive: false, group: webhooks}
  AUTHARA_WEBHOOK_FAILED_RETENTION: {control: env, reload: startup, sensitive: false, group: webhooks}
