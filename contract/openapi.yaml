openapi: 3.0.3

info:
  title: Authara HTTP API
  version: 0.1.0
  description: |
    Public browser-facing and internal server-to-server JSON APIs exposed by Authara.
    HTML routes and deployment behavior are intentionally outside this description.

servers:
  - url: /

tags:
  - name: Authentication
  - name: Passkeys
  - name: Sessions
  - name: Users
  - name: Organizations
  - name: Internal

paths:
  /auth/api/v1/csrf:
    get:
      operationId: getCsrfToken
      tags: [Authentication]
      summary: Get a CSRF token
      description: Issues a CSRF token cookie and returns the token value for browser API calls.
      security: []
      x-authara-access: public
      x-authara-set-cookies: [authara_csrf]
      x-authara-error-codes:
        "500": [internal_error]
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFToken"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/oauth/google/options:
    get:
      operationId: getGoogleLoginOptions
      tags: [Authentication]
      summary: Get Google login options
      description: Returns the Google client ID and nonce needed to start the Google sign-in flow.
      security: []
      x-authara-access: public
      x-authara-availability: google-enabled
      x-authara-set-cookies: [authara_oauth_nonce]
      x-authara-error-codes:
        "404": [not_found]
        "500": [internal_error]
      responses:
        "200":
          description: Google login options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLoginOptions"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/oauth/google:
    post:
      operationId: loginWithGoogle
      tags: [Authentication]
      summary: Log in with a Google ID token
      description: Exchanges a verified Google ID token for Authara session cookies and JSON tokens.
      parameters:
        - $ref: "#/components/parameters/Audience"
      security:
        - csrfCookie: []
          csrfHeader: []
          oauthNonceCookie: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: google-enabled
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden]
        "404": [not_found]
        "409": [account_link_required]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/invitations/preview:
    get:
      operationId: previewInvitation
      tags: [Organizations]
      summary: Preview an organization invitation
      description: Returns the invitation, organization, and current invitation status for a valid bearer token.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      security: []
      x-authara-access: public
      x-authara-availability: invitations-enabled
      x-authara-error-codes:
        "400": [invalid_request]
        "403": [forbidden]
        "404": [not_found, invitation_not_found]
        "500": [internal_error]
      responses:
        "200":
          description: Invitation preview, including invitations that are no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Organizations]
      summary: Accept an invitation and switch the current session to its organization
      description: Accepts the invitation for the authenticated user and rotates the current session into the invited organization.
      parameters:
        - $ref: "#/components/parameters/AppAudience"
      security:
        - accessCookie: []
          csrfCookie: []
          csrfHeader: []
      x-authara-access: user
      x-authara-csrf: required
      x-authara-availability: invitations-enabled
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden, invitation_email_mismatch]
        "404": [not_found, invitation_not_found]
        "409": [invitation_already_accepted, invitation_revoked, invitation_expired, organization_membership_conflict]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Session tokens scoped to the invitation organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/invitations/login:
    post:
      operationId: loginAndAcceptInvitation
      tags: [Authentication]
      summary: Log in with a password, accept an invitation, and switch organizations
      description: Uses the invitation email and supplied password to authenticate, accept the invitation, and create a session in the invited organization.
      parameters:
        - $ref: "#/components/parameters/AppAudience"
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: invitations-enabled
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden, invitation_email_mismatch]
        "404": [not_found, invitation_not_found]
        "409": [invitation_already_accepted, invitation_revoked, invitation_expired, organization_membership_conflict]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationPasswordLoginRequest"
      responses:
        "200":
          description: Authenticated session scoped to the invitation organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/invitations/google:
    post:
      operationId: authenticateAndAcceptInvitationWithGoogle
      tags: [Authentication]
      summary: Sign up or log in with Google, accept an invitation, and switch organizations
      description: Returns a recovery link instead of a session when the Google identity must first be linked to an existing account.
      parameters:
        - $ref: "#/components/parameters/AppAudience"
      security:
        - csrfCookie: []
          csrfHeader: []
          oauthNonceCookie: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: [invitations-enabled, google-enabled]
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden, invitation_email_mismatch]
        "404": [not_found, invitation_not_found]
        "409": [invitation_flow_mismatch, auth_method_already_linked, invitation_already_accepted, invitation_revoked, invitation_expired, organization_membership_conflict]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationGoogleRequest"
      responses:
        "200":
          description: Authenticated session or an existing-account recovery link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationGoogleResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/provider-links/recovery/google:
    post:
      operationId: startGoogleAccountRecoveryLink
      tags: [Authentication]
      summary: Start linking Google to an existing account with the same email
      description: Verifies a Google identity and creates a short-lived link that can be completed by proving ownership of the existing account.
      security:
        - csrfCookie: []
          csrfHeader: []
          oauthNonceCookie: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: google-enabled
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden]
        "404": [not_found]
        "409": [auth_method_already_linked]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "202":
          description: Existing-account proof is required before Google can be linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRecoveryLink"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/provider-links/recovery/{linkID}/password:
    post:
      operationId: completeAccountRecoveryLinkWithPassword
      tags: [Authentication]
      summary: Prove ownership with the existing account password and finish linking
      description: Consumes a recovery link after password proof, creates a session, and optionally accepts and switches to an invitation organization.
      parameters:
        - $ref: "#/components/parameters/ProviderLinkID"
        - $ref: "#/components/parameters/AppAudience"
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden, invitation_email_mismatch]
        "404": [password_provider_not_found, invitation_not_found]
        "409": [provider_link_expired, auth_method_already_linked, invitation_already_accepted, invitation_revoked, invitation_expired, organization_membership_conflict]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRecoveryPasswordProofRequest"
      responses:
        "200":
          description: Linked provider and authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/provider-links/recovery/{linkID}/google:
    post:
      operationId: completeAccountRecoveryLinkWithGoogle
      tags: [Authentication]
      summary: Prove ownership with an existing Google login and finish linking
      description: Consumes a recovery link after provider proof, creates a session, and optionally accepts and switches to an invitation organization.
      parameters:
        - $ref: "#/components/parameters/ProviderLinkID"
        - $ref: "#/components/parameters/AppAudience"
      security:
        - csrfCookie: []
          csrfHeader: []
          oauthNonceCookie: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: google-enabled
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden, invitation_email_mismatch]
        "404": [not_found, invitation_not_found]
        "409": [provider_link_expired, auth_method_already_linked, invitation_already_accepted, invitation_revoked, invitation_expired, organization_membership_conflict]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRecoveryGoogleProofRequest"
      responses:
        "200":
          description: Linked provider and authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/login:
    post:
      operationId: loginWithPassword
      tags: [Authentication]
      summary: Log in with email and password
      description: Authenticates a user with email and password and creates a new Authara session.
      parameters:
        - $ref: "#/components/parameters/Audience"
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/signup/direct:
    post:
      operationId: signupDirect
      tags: [Authentication]
      summary: Create an account without a signup challenge
      description: Creates a user account immediately when challenge-based signup is disabled.
      parameters:
        - $ref: "#/components/parameters/AppAudience"
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: challenges-disabled
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "403": [forbidden]
        "404": [not_found]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Created account and authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/signup/challenges:
    post:
      operationId: startSignupChallenge
      tags: [Authentication]
      summary: Start challenge-based signup
      description: Starts signup by creating and delivering a verification challenge for the email address.
      parameters:
        - $ref: "#/components/parameters/AppAudience"
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: challenges-enabled
      x-authara-error-codes:
        "400": [invalid_request]
        "403": [forbidden]
        "404": [not_found]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Signup challenge started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/signup/challenges/verify:
    post:
      operationId: verifySignupChallenge
      tags: [Authentication]
      summary: Verify a signup challenge and create the account
      description: Verifies the signup challenge code, creates the account, and starts an Authara session.
      parameters:
        - $ref: "#/components/parameters/AppAudience"
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-availability: challenges-enabled
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "403": [forbidden]
        "404": [not_found]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupChallengeVerification"
      responses:
        "201":
          description: Created account and authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/password-reset/challenges:
    post:
      operationId: startPasswordResetChallenge
      tags: [Authentication]
      summary: Start a password reset challenge
      description: Starts password recovery without revealing whether the email address belongs to an account.
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-error-codes:
        "400": [invalid_request]
        "403": [forbidden]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Password reset challenge accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeReference"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/password-reset/challenges/verify:
    post:
      operationId: verifyPasswordResetChallenge
      tags: [Authentication]
      summary: Verify a password reset challenge
      description: Verifies the emailed code, changes the password, and revokes all existing sessions for the account.
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-error-codes:
        "400": [invalid_request]
        "403": [forbidden]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetChallengeVerification"
      responses:
        "204":
          description: Password reset completed and existing sessions revoked
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/challenges/resend:
    post:
      operationId: resendChallenge
      tags: [Authentication]
      summary: Request another challenge verification code
      description: Queues another verification code for an existing signup or recovery challenge.
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-error-codes:
        "400": [invalid_request]
        "403": [forbidden]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeReference"
      responses:
        "204":
          description: Challenge resend accepted without revealing challenge state
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/passkeys/authenticate/options:
    post:
      operationId: beginPasskeyAuthentication
      tags: [Passkeys]
      summary: Start passkey authentication
      description: Creates a passkey authentication challenge and returns WebAuthn options for the client.
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-error-codes:
        "403": [forbidden]
        "429": [rate_limited]
        "500": [internal_error]
      responses:
        "200":
          description: Passkey authentication options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/api/v1/passkeys/authenticate/finish:
    post:
      operationId: finishPasskeyAuthentication
      tags: [Passkeys]
      summary: Finish passkey authentication
      description: Verifies the passkey assertion and creates an Authara session for the matching user.
      parameters:
        - $ref: "#/components/parameters/Audience"
      security:
        - csrfCookie: []
          csrfHeader: []
      x-authara-access: public
      x-authara-csrf: required
      x-authara-set-cookies: [authara_access, authara_refresh]
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "403": [forbidden]
        "429": [rate_limited]
        "500": [internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthenticationFinishRequest"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
