        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/internal/v1/organizations/{organizationID}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    post:
      operationId: createInternalOrganizationInvitation
