        "201":
          description: Fresh invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/internal/v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: deleteInternalUser
      tags: [Internal]
      summary: Delete a user
      description: Permanently deletes a user after the application backend has approved account-level dependencies such as active subscriptions.
      security:
        - internalBearer: []
      x-authara-access: internal
      x-authara-error-codes:
        "400": [invalid_request]
        "401": [unauthorized]
        "404": [user_not_found]
        "409": [last_active_admin, last_organization_owner, last_organization_member]
        "500": [internal_error]
      responses:
        "204":
          description: User deleted
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: authara_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: authara_refresh
    csrfCookie:
      type: apiKey
      in: cookie
      name: authara_csrf
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    oauthNonceCookie:
      type: apiKey
      in: cookie
      name: authara_oauth_nonce
    internalBearer:
      type: http
      scheme: bearer
      x-authara-auth-mode: internal_bearer

  parameters:
    Audience:
      name: audience
      in: query
      required: false
      schema:
        type: string
        enum: [app, admin]
        default: app
    AppAudience:
      name: audience
      in: query
      required: false
      schema:
        type: string
        enum: [app]
        default: app
    OrganizationID:
      name: organizationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PasskeyID:
      name: passkeyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderLinkID:
      name: linkID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [password, google]

  responses:
    Error:
      description: Error response declared by x-authara-error-codes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    CSRFToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
    GoogleLoginOptions:
      type: object
      additionalProperties: false
      required: [client_id, nonce]
      properties:
        client_id:
          type: string
        nonce:
          type: string
    GoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [credential, nonce]
      properties:
        credential:
          type: string
        nonce:
          type: string
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    InvitationPasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
    InvitationGoogleRequest:
      type: object
      additionalProperties: false
      required: [token, credential, nonce, flow]
      properties:
        token:
          type: string
        credential:
          type: string
        nonce:
          type: string
        flow:
          type: string
          enum: [signup, login]
    AccountRecoveryPasswordProofRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
        invitation_token:
          type: string
    AccountRecoveryGoogleProofRequest:
      type: object
      additionalProperties: false
      required: [credential, nonce]
      properties:
        credential:
          type: string
        nonce:
          type: string
        invitation_token:
          type: string
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        invitation_code:
          type: string
    SignupChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          format: uuid
    SignupChallengeVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, new_password]
      properties:
        email:
          type: string
          format: email
        new_password:
          type: string
          format: password
    PasswordResetChallengeVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
    SetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    ChangeUsernameRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [new_email]
      properties:
        new_email:
          type: string
          format: email
    ChallengeVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
    ChallengeReference:
      type: object
      additionalProperties: false
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          format: uuid

    AccountRecoveryLink:
      type: object
      additionalProperties: false
      required: [link_id, proof_methods]
      properties:
        link_id:
          type: string
          format: uuid
        proof_methods:
          type: array
          items:
            type: string
            enum: [password, google]

    InvitationPreview:
      type: object
      additionalProperties: false
      required: [invitation, organization]
      properties:
        invitation:
          $ref: "#/components/schemas/OrganizationInvitation"
        organization:
          $ref: "#/components/schemas/Organization"
    InvitationGoogleResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, proof_required]
        session:
          $ref: "#/components/schemas/AuthSession"
        recovery:
          $ref: "#/components/schemas/AccountRecoveryLink"

    AuthSession:
      type: object
      additionalProperties: false
      required: [user, access_token, refresh_token]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        access_token:
          type: string
        refresh_token:
          type: string
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, username, disabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [challenge_id, options]
      properties:
        challenge_id:
          type: string
          format: uuid
        options:
          type: object
          additionalProperties: true
    PasskeyAuthenticationFinishRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
    PasskeyRegistrationFinishRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
        name:
          type: string
        platform_hint:
          type: string

    Tokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    TokenRefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
        audience:
          type: string
          enum: [app, admin]
          default: app

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, username, disabled, created_at, roles, organization]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
            enum: ["authara:admin", "authara:auditor", "authara:monitor"]
        organization:
          $ref: "#/components/schemas/OrganizationSummary"
    Account:
      type: object
      additionalProperties: false
      required: [user, sessions, auth_methods, passkeys]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AccountSession"
        auth_methods:
          type: array
          items:
            $ref: "#/components/schemas/AuthMethod"
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/AccountPasskey"
    AccountSession:
      type: object
      additionalProperties: false
      required: [id, current, created_at, expires_at, user_agent]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        user_agent:
          type: string
    AuthMethod:
      type: object
      additionalProperties: false
      required: [provider, created_at]
      properties:
        provider:
          type: string
          enum: [password, google]
        created_at:
          type: string
          format: date-time
    AccountPasskey:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
